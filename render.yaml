services:
    - type: web
    name: tilisi-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: tilisi-db
          property: connectionString
            - key: SECRET_KEY
        generateValue: true
databases:
    - name: tilisi-db
    databaseName: tilisi
    user: tilisi
